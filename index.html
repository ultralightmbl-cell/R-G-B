<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>R&G&B — Premium Chromatic Glitch Engine</title>
  <!-- Google Fonts から Montserrat, Outfit と Noto Sans JP を読み込み -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500;600&family=Outfit:wght@300;400;600;700&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <img src="title.svg" alt="R&G&B" class="main-title-logo">
    </header>
  
    <div class="workspace-layout">
      <!-- 左側：統合された画像ワークスペース（プレビュー ＆ ドロップエリア） -->
      <section class="workspace-left">
        <div id="drop-zone" class="drop-zone">
          <!-- 初期表示：プレースホルダー -->
          <div id="drop-placeholder">
            <div class="placeholder-icon">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="17 8 12 3 7 8"/>
                <line x1="12" y1="3" x2="12" y2="15"/>
              </svg>
            </div>
            <p class="placeholder-title">DRAG & DROP IMAGE HERE</p>
            <p class="placeholder-or">OR</p>
            <button type="button" id="btn-select-file" class="btn btn-secondary btn-select">SELECT FILE</button>
            <input type="file" id="file-input" accept="image/*" style="display: none;">
          </div>
  
          <!-- 画像ロード後の表示用コンテナ -->
          <div id="canvas-container" style="display: none;">
            <canvas id="preview-canvas"></canvas>
            <p id="image-dimensions" class="dimensions-tag"></p>
          </div>
        </div>
      </section>
  
      <!-- 右側：コントロールパネル -->
      <aside class="workspace-right">
        <div class="control-panel">
          <div class="panel-header">
            <h3 class="panel-title">CONTROL</h3>
            <div class="action-buttons">
              <button id="btn-reset" class="btn btn-secondary" disabled>RESET</button>
              <button id="btn-download" class="btn btn-primary" disabled>SAVE</button>
            </div>
          </div>
          
          <hr class="divider">
    
          <!-- 重なり効果（ブレンドモード）選択 -->
          <div class="control-item">
            <label class="control-label">BLEND</label>
            <div class="select-wrapper">
              <select id="select-blend" disabled>
                <option value="screen" selected>SCREEN</option>
                <option value="difference">DIFFERENCE</option>
              </select>
            </div>
          </div>
    
          <hr class="divider">
    
          <!-- ハーフトーン設定 -->
          <div class="control-item">
            <label class="control-label">DOT</label>
            <div class="select-wrapper">
              <select id="select-halftone" disabled>
                <option value="none" selected>NONE</option>
                <option value="dot">DOT</option>
              </select>
            </div>
          </div>
          <div class="control-item size-control">
            <div class="slider-header">
              <span class="control-label">SIZE</span>
              <span class="value-display"><span id="val-halftone-size">10</span>px</span>
            </div>
            <input type="range" id="input-halftone-size" min="4" max="24" value="10" disabled>
          </div>
    
          <hr class="divider">
    
          <!-- RED -->
          <div class="channel-card card-red">
            <div class="channel-header">
              <span class="channel-title">RED (R)</span>
              <label class="toggle-switch">
                <input type="checkbox" id="visible-r" checked disabled>
                <span class="toggle-slider"></span>
                <span class="toggle-label">SHOW</span>
              </label>
            </div>
            <div class="channel-body">
              <div class="control-item">
                <div class="slider-header">
                  <span>X</span>
                  <span class="value-display"><span id="val-rx">0</span>px</span>
                </div>
                <input type="range" id="shift-rx" min="-50" max="50" value="0" disabled>
              </div>
              <div class="control-item">
                <div class="slider-header">
                  <span>Y</span>
                  <span class="value-display"><span id="val-ry">0</span>px</span>
                </div>
                <input type="range" id="shift-ry" min="-50" max="50" value="0" disabled>
              </div>
              <div class="control-item">
                <div class="slider-header">
                  <span>OPACITY</span>
                  <span class="value-display"><span id="val-ro">100</span>%</span>
                </div>
                <input type="range" id="shift-ro" min="0" max="100" value="100" disabled>
              </div>
            </div>
          </div>
    
          <!-- GREEN -->
          <div class="channel-card card-green">
            <div class="channel-header">
              <span class="channel-title">GREEN (G)</span>
              <label class="toggle-switch">
                <input type="checkbox" id="visible-g" checked disabled>
                <span class="toggle-slider"></span>
                <span class="toggle-label">SHOW</span>
              </label>
            </div>
            <div class="channel-body">
              <div class="control-item">
                <div class="slider-header">
                  <span>X</span>
                  <span class="value-display"><span id="val-gx">0</span>px</span>
                </div>
                <input type="range" id="shift-gx" min="-50" max="50" value="0" disabled>
              </div>
              <div class="control-item">
                <div class="slider-header">
                  <span>Y</span>
                  <span class="value-display"><span id="val-gy">0</span>px</span>
                </div>
                <input type="range" id="shift-gy" min="-50" max="50" value="0" disabled>
              </div>
              <div class="control-item">
                <div class="slider-header">
                  <span>OPACITY</span>
                  <span class="value-display"><span id="val-go">100</span>%</span>
                </div>
                <input type="range" id="shift-go" min="0" max="100" value="100" disabled>
              </div>
            </div>
          </div>
    
          <!-- BLUE -->
          <div class="channel-card card-blue">
            <div class="channel-header">
              <span class="channel-title">BLUE (B)</span>
              <label class="toggle-switch">
                <input type="checkbox" id="visible-b" checked disabled>
                <span class="toggle-slider"></span>
                <span class="toggle-label">SHOW</span>
              </label>
            </div>
            <div class="channel-body">
              <div class="control-item">
                <div class="slider-header">
                  <span>X</span>
                  <span class="value-display"><span id="val-bx">0</span>px</span>
                </div>
                <input type="range" id="shift-bx" min="-50" max="50" value="0" disabled>
              </div>
              <div class="control-item">
                <div class="slider-header">
                  <span>Y</span>
                  <span class="value-display"><span id="val-by">0</span>px</span>
                </div>
                <input type="range" id="shift-by" min="-50" max="50" value="0" disabled>
              </div>
              <div class="control-item">
                <div class="slider-header">
                  <span>OPACITY</span>
                  <span class="value-display"><span id="val-bo">100</span>%</span>
                </div>
                <input type="range" id="shift-bo" min="0" max="100" value="100" disabled>
              </div>
            </div>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
